<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart v2 Dashboard</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text2: #8b949e;
    --green: #3fb950;
    --red: #f85149;
    --blue: #58a6ff;
    --purple: #bc8cff;
    --orange: #d29922;
    --cyan: #39d2c0;
    --yellow: #e3b341;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .header h1 {
    font-size: 24px;
    font-weight: 600;
  }
  .header h1 span { color: var(--blue); }
  .header .meta {
    font-size: 13px;
    color: var(--text2);
    text-align: right;
  }
  .header .meta .live {
    display: inline-block;
    width: 8px; height: 8px;
    background: var(--green);
    border-radius: 50%;
    margin-right: 4px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Overview Cards */
  .overview {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
  }
  .stat-card .label {
    font-size: 13px;
    color: var(--text2);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .stat-card .value {
    font-size: 28px;
    font-weight: 700;
  }
  .stat-card .sub {
    font-size: 12px;
    color: var(--text2);
    margin-top: 4px;
  }

  /* Category Cards */
  .categories {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  .cat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }
  .cat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }
  .cat-card.sports::before { background: var(--green); }
  .cat-card.politics::before { background: var(--blue); }
  .cat-card.weather::before { background: var(--orange); }
  .cat-card.tech::before { background: var(--purple); }
  .cat-card.other::before { background: var(--text2); }

  .cat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .cat-header .cat-name {
    font-size: 18px;
    font-weight: 600;
  }
  .cat-header .cat-icon {
    font-size: 24px;
  }
  .cat-stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  .cat-stat .num {
    font-size: 18px;
    font-weight: 700;
  }
  .cat-stat .lbl {
    font-size: 11px;
    color: var(--text2);
    text-transform: uppercase;
  }
  .cat-bar {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .cat-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.5s ease;
  }
  .cat-card.sports .cat-bar-fill { background: var(--green); }
  .cat-card.politics .cat-bar-fill { background: var(--blue); }
  .cat-card.weather .cat-bar-fill { background: var(--orange); }
  .cat-card.tech .cat-bar-fill { background: var(--purple); }
  .cat-card.other .cat-bar-fill { background: var(--text2); }

  .cat-markets {
    list-style: none;
    max-height: 280px;
    overflow-y: auto;
  }
  .cat-markets li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .cat-markets li:last-child { border-bottom: none; }
  .cat-markets li a {
    color: var(--text);
    text-decoration: none;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-right: 8px;
    transition: color 0.2s;
  }
  .cat-markets li a:hover {
    color: var(--blue);
    text-decoration: underline;
  }
  .cat-markets .mkt-vol {
    font-weight: 600;
    white-space: nowrap;
    min-width: 60px;
    text-align: right;
  }
  .cat-markets .mkt-side {
    width: 6px; height: 6px;
    border-radius: 50%;
    margin-right: 6px;
    flex-shrink: 0;
  }

  /* Recent Trades */
  .recent-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .recent-section h2 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 16px;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
  }
  .recent-section h2::after {
    content: '▼';
    font-size: 12px;
    color: var(--text2);
    margin-left: auto;
    transition: transform 0.2s;
  }
  .recent-section.collapsed h2::after {
    transform: rotate(-90deg);
  }
  .recent-section .section-content {
    overflow: hidden;
    transition: max-height 0.3s ease;
  }
  .recent-section.collapsed .section-content {
    max-height: 0 !important;
  }
  .win-rate {
    font-size: 13px;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: 6px;
    margin-left: 8px;
  }
  .win-rate.high { background: rgba(63, 179, 80, 0.15); color: var(--green); }
  .win-rate.mid { background: rgba(210, 169, 34, 0.15); color: var(--orange); }
  .win-rate.low { background: rgba(248, 81, 73, 0.15); color: var(--red); }
  .trades-table {
    width: 100%;
    border-collapse: collapse;
  }
  .trades-table th {
    text-align: left;
    font-size: 11px;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }
  .trades-table td {
    padding: 10px 12px;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  .trades-table tr:last-child td { border-bottom: none; }
  .trades-table .side-buy { color: var(--green); font-weight: 600; }
  .trades-table .side-sell { color: var(--red); font-weight: 600; }
  .trades-table .cat-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
  }
  .cat-tag.sports { background: rgba(63,185,80,0.15); color: var(--green); }
  .cat-tag.politics { background: rgba(88,166,255,0.15); color: var(--blue); }
  .cat-tag.weather { background: rgba(211,153,34,0.15); color: var(--orange); }
  .cat-tag.tech { background: rgba(188,140,255,0.15); color: var(--purple); }
  .cat-tag.other { background: rgba(139,148,158,0.15); color: var(--text2); }
  .trades-table a {
    color: var(--text);
    text-decoration: none;
    transition: color 0.2s;
  }
  .trades-table a:hover {
    color: var(--blue);
    text-decoration: underline;
  }

  .vol-bar {
    display: inline-block;
    height: 4px;
    border-radius: 2px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .vol-bar.buy { background: var(--green); }
  .vol-bar.sell { background: var(--red); }

  @media (max-width: 900px) {
    .overview { grid-template-columns: repeat(2, 1fr); }
    .categories { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>🧠 <span>Smart v2</span> Dashboard</h1>
  <div class="meta">
    <div><span class="live"></span> alphaalii Tracker</div>
    <div id="update-time">Loading...</div>
  </div>
</div>

<div id="recent-sections"></div>

<script>
const VERSION = '1793540073';
// Auto-detect: local API or GitHub Pages static JSON
const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
const API_URL = isLocal
  ? `http://${window.location.hostname}:8900/api/data`
  : `./data.json`;
const IS_GITHUB_PAGES = !isLocal;

const CAT_META = {
  sports:   { icon: '🏀', label: 'Sports',   color: '#3fb950' },
  politics: { icon: '🏛️', label: 'Politics', color: '#58a6ff' },
  weather:  { icon: '🌤️', label: 'Weather',  color: '#d29922' },
  tech:     { icon: '💻', label: 'Tech',     color: '#bc8cff' },
  other:    { icon: '📊', label: 'Other',    color: '#8b949e' },
};

function fmt(n) {
  n = Number(n) || 0;
  if (n >= 1000000) return '$' + (n/1000000).toFixed(1) + 'M';
  if (n >= 1000) return '$' + (n/1000).toFixed(1) + 'K';
  return '$' + Math.round(n);
}

function formatTime(iso) {
  const d = new Date(iso);
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  const hour = String(d.getHours()).padStart(2, '0');
  const min = String(d.getMinutes()).padStart(2, '0');
  const sec = String(d.getSeconds()).padStart(2, '0');
  return `${year}-${month}-${day} ${hour}:${min}:${sec}`;
}

function toggleSection(el) {
  el.parentElement.classList.toggle('collapsed');
}

async function loadData() {
  try {
    console.log('🔄 Fetching data from:', API_URL);
    const cacheBuster = IS_GITHUB_PAGES ? '&_=' + Date.now() : '?t=' + Date.now();
    const fetchUrl = IS_GITHUB_PAGES
      ? API_URL + '?_=' + Date.now()
      : API_URL + '?t=' + Date.now();
    const res = await fetch(fetchUrl, {
      cache: 'no-store',
      headers: { 'Cache-Control': 'no-cache' }
    });
    console.log('✅ Response status:', res.status);
    if (!res.ok) {
      throw new Error(`HTTP ${res.status}: ${res.statusText}`);
    }
    const data = await res.json();
    console.log('✅ Data loaded:', Object.keys(data));
    console.log('✅ Categories:', Object.keys(data.categories || {}));
    console.log('✅ Recent trades:', (data.recent || []).length);
    render(data);
    document.getElementById('update-time').textContent = 'Updated: ' + new Date().toLocaleTimeString();
    console.log('✅ Render complete');
  } catch (e) {
    console.error('❌ Load error:', e);
    document.getElementById('update-time').textContent = 'Error: ' + e.message;
  }
}

function render(data) {
  try {
  const stats = data.stats || {};
  const categories = data.categories || {};
  const recent = data.recent || [];
  const generatedAt = data.generatedAt;

  // Update time
  try {
    const updateTime = new Date(generatedAt).toLocaleString('zh-CN', { hour12: false, timeZone: 'Asia/Shanghai' });
    document.getElementById('update-time').textContent = updateTime;
  } catch (e) {
    document.getElementById('update-time').textContent = generatedAt || '';
  }

  // Recent trades - grouped by category
  const container = document.getElementById('recent-sections');
  const CAT_ORDER = ['sports', 'tech', 'politics', 'weather', 'other'];
  const winRates = data.winRates || {};
  let html = '';
  for (const cat of CAT_ORDER) {
    const catTrades = (recent || []).filter(t => t.category === cat);
    if (!catTrades.length) continue;
    const catMeta = CAT_META[cat] || CAT_META.other;
    const wr = winRates[cat];
    let wrHtml = '';
    if (wr && wr.rate != null) {
      const wrClass = wr.rate >= 60 ? 'high' : wr.rate >= 45 ? 'mid' : 'low';
      wrHtml = '<span class="win-rate ' + wrClass + '">14天胜率 ' + wr.rate + '% (' + wr.wins + 'W/' + wr.losses + 'L)</span>';
    }
    html += '<div class="recent-section">';
    html += '<h2 onclick="toggleSection(this)">' + catMeta.icon + ' ' + catMeta.label + ' <span style="color:var(--text2);font-size:14px;font-weight:400">(' + catTrades.length + ')</span>' + wrHtml + '</h2>';
    html += '<div class="section-content">';
    html += '<table class="trades-table"><thead><tr>';
    html += '<th>Time</th><th>Trader</th><th>Market</th><th>Side</th><th>Direction</th><th>Price</th><th>Value</th>';
    html += '</tr></thead><tbody>';
    for (const t of catTrades) {
      const sideClass = t.side === 'BUY' ? 'side-buy' : 'side-sell';
      const url = t.url || (t.slug ? 'https://polymarket.com/event/' + t.slug : '#');
      const marketName = (t.market || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const trader = t.traderLabel || t.trader || '-';
      html += '<tr>'
        + '<td style="color:var(--text2);white-space:nowrap">' + formatTime(t.time || '') + '</td>'
        + '<td style="color:var(--purple);font-weight:500">' + trader + '</td>'
        + '<td><a href="' + url + '" target="_blank" rel="noopener">' + marketName + '</a></td>'
        + '<td class="' + sideClass + '">' + (t.side || '-') + '</td>'
        + '<td>' + (t.direction || '-') + '</td>'
        + '<td style="color:var(--cyan)">' + (t.price != null ? (t.price * 100).toFixed(2) + '¢' : '-') + '</td>'
        + '<td style="font-weight:600">' + fmt(t.value || 0) + '</td>'
        + '</tr>';
    }
    html += '</tbody></table></div></div>';
  }
  container.innerHTML = html || '<div style="text-align:center;color:var(--text2);padding:40px">暂无交易</div>';

  } catch (renderErr) {
    console.error('Render error:', renderErr);
    document.getElementById('update-time').textContent = 'Render Error: ' + renderErr.message;
  }
}

// Initial load + auto-refresh every 5 minutes
loadData();
setInterval(loadData, 5 * 60 * 1000);
</script>
</body>
</html>
