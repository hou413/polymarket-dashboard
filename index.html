<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymarket 聪明钱动向看板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }
        
        .assets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .asset-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        
        .asset-card:hover {
            transform: translateY(-5px);
        }
        
        .asset-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .asset-name {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }
        
        .asset-stats {
            display: flex;
            gap: 15px;
            font-size: 0.9em;
        }
        
        .stat-up {
            color: #10b981;
            font-weight: 600;
        }
        
        .stat-down {
            color: #ef4444;
            font-weight: 600;
        }
        
        .orders-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            background: #f8f9fa;
            transition: background 0.2s;
        }
        
        .order-item:hover {
            background: #e9ecef;
        }
        
        .order-item.up {
            border-left: 4px solid #10b981;
        }
        
        .order-item.down {
            border-left: 4px solid #ef4444;
        }
        
        .order-direction {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }
        
        .order-direction.up {
            color: #10b981;
        }
        
        .order-direction.down {
            color: #ef4444;
        }
        
        .order-details {
            text-align: right;
        }
        
        .order-amount {
            font-weight: bold;
            font-size: 1.1em;
        }
        
        .order-meta {
            font-size: 0.85em;
            color: #666;
            margin-top: 2px;
        }
        
        .last-update {
            text-align: center;
            color: rgba(255,255,255,0.8);
            font-size: 0.9em;
            margin-top: 20px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .updating {
            animation: pulse 1s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 Polymarket 聪明钱动向</h1>
            <div class="subtitle">BTC / ETH / SOL / DOGE 1小时市场实时监控</div>
        </div>
        
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="totalOrders">-</div>
                <div class="stat-label">大额订单数</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalVolume">-</div>
                <div class="stat-label">总金额 (USD)</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="upOrders">-</div>
                <div class="stat-label">看涨订单</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="downOrders">-</div>
                <div class="stat-label">看跌订单</div>
            </div>
        </div>
        
        <div class="assets-grid" id="assetsGrid">
            <div class="asset-card">
                <div class="loading">加载中...</div>
            </div>
        </div>
        
        <div class="last-update">
            最后更新: <span id="lastUpdate">-</span>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:3001';
        
        async function fetchDashboard() {
            try {
                const res = await fetch(`${API_BASE}/api/dashboard`);
                const data = await res.json();
                updateDashboard(data);
            } catch (error) {
                console.error('Failed to fetch dashboard:', error);
            }
        }
        
        function updateDashboard(data) {
            // Update stats
            document.getElementById('totalOrders').textContent = data.summary.totalOrders;
            document.getElementById('totalVolume').textContent = '$' + formatNumber(data.summary.totalVolume);
            document.getElementById('upOrders').textContent = data.summary.upOrders;
            document.getElementById('downOrders').textContent = data.summary.downOrders;
            
            // Update assets grid
            const grid = document.getElementById('assetsGrid');
            grid.innerHTML = '';
            
            for (const [asset, assetData] of Object.entries(data.assets)) {
                const card = createAssetCard(asset, assetData);
                grid.appendChild(card);
            }
            
            // Update last update time
            const updateTime = new Date(data.lastUpdate).toLocaleString('zh-CN');
            document.getElementById('lastUpdate').textContent = updateTime;
        }
        
        function createAssetCard(asset, data) {
            const card = document.createElement('div');
            card.className = 'asset-card';
            
            const upVolume = data.orders.filter(o => o.direction === 'UP').reduce((sum, o) => sum + o.value, 0);
            const downVolume = data.orders.filter(o => o.direction === 'DOWN').reduce((sum, o) => sum + o.value, 0);
            
            card.innerHTML = `
                <div class="asset-header">
                    <div class="asset-name">${asset}</div>
                    <div class="asset-stats">
                        <span class="stat-up">↑ $${formatNumber(upVolume)}</span>
                        <span class="stat-down">↓ $${formatNumber(downVolume)}</span>
                    </div>
                </div>
                <div class="orders-list">
                    ${data.orders.length === 0 ? '<div class="loading">暂无大额订单</div>' : ''}
                    ${data.orders.slice(0, 20).map(order => `
                        <div class="order-item ${order.direction.toLowerCase()}">
                            <div class="order-direction ${order.direction.toLowerCase()}">
                                ${order.direction === 'UP' ? '📈' : '📉'}
                                <span>${order.direction}</span>
                                <span style="font-size: 0.85em; color: #666;">${order.type}</span>
                            </div>
                            <div class="order-details">
                                <div class="order-amount">$${formatNumber(order.value)}</div>
                                <div class="order-meta">${formatNumber(order.size)} shares @ ${(order.price * 100).toFixed(1)}¢</div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            
            return card;
        }
        
        function formatNumber(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(2) + 'M';
            } else if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num.toFixed(0);
        }
        
        // Initial fetch
        fetchDashboard();
        
        // Refresh every 30 seconds
        setInterval(fetchDashboard, 30000);
    </script>
</body>
</html>
