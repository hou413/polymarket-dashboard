<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymarket 聪明钱动向看板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #eee;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header .subtitle {
            font-size: 1.1em;
            color: #888;
        }
        
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #00d4ff;
        }
        
        .stat-label {
            font-size: 0.9em;
            color: #888;
            margin-top: 5px;
        }
        
        .traders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .trader-card {
            background: rgba(30, 30, 50, 0.9);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .trader-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
        }
        
        .trader-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .trader-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #fff;
        }
        
        .trader-address {
            font-size: 0.75em;
            color: #666;
            font-family: monospace;
        }
        
        .win-rate {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 15px;
            border-radius: 10px;
            min-width: 80px;
        }
        
        .win-rate.high {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
        }
        
        .win-rate.medium {
            background: rgba(251, 191, 36, 0.2);
            border: 1px solid #fbbf24;
        }
        
        .win-rate.low {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
        }
        
        .win-rate-value {
            font-size: 1.5em;
            font-weight: bold;
        }
        
        .win-rate.high .win-rate-value { color: #10b981; }
        .win-rate.medium .win-rate-value { color: #fbbf24; }
        .win-rate.low .win-rate-value { color: #ef4444; }
        
        .win-rate-label {
            font-size: 0.7em;
            color: #888;
            margin-top: 2px;
        }
        
        .trader-stats {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 0.85em;
        }
        
        .trader-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            padding: 8px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
        }
        
        .trader-stat-value {
            font-weight: bold;
            color: #00d4ff;
        }
        
        .trader-stat-label {
            font-size: 0.8em;
            color: #666;
            margin-top: 3px;
        }
        
        .trades-list {
            max-height: 280px;
            overflow-y: auto;
        }
        
        .trades-list::-webkit-scrollbar {
            width: 6px;
        }
        
        .trades-list::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 3px;
        }
        
        .trades-list::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.3);
            border-radius: 3px;
        }
        
        .trade-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            margin-bottom: 6px;
            border-radius: 8px;
            background: rgba(255,255,255,0.03);
            transition: background 0.2s;
        }
        
        .trade-item:hover {
            background: rgba(255,255,255,0.08);
        }
        
        .trade-item.buy {
            border-left: 3px solid #10b981;
        }
        
        .trade-item.sell {
            border-left: 3px solid #ef4444;
        }
        
        .trade-info {
            flex: 1;
            min-width: 0;
        }
        
        .trade-title {
            font-size: 0.85em;
            color: #ddd;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }
        
        .trade-meta {
            font-size: 0.75em;
            color: #666;
            margin-top: 3px;
        }
        
        .trade-side {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.8em;
            font-weight: 600;
        }
        
        .trade-side.buy { color: #10b981; }
        .trade-side.sell { color: #ef4444; }
        
        .trade-amount {
            text-align: right;
            font-weight: bold;
            color: #00d4ff;
            font-size: 0.9em;
        }
        
        .trade-time {
            font-size: 0.7em;
            color: #666;
            text-align: right;
        }
        
        .no-trades {
            text-align: center;
            padding: 30px;
            color: #555;
        }
        
        .last-update {
            text-align: center;
            color: #666;
            font-size: 0.9em;
            margin-top: 20px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error {
            color: #ef4444;
            text-align: center;
            padding: 20px;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .updating {
            animation: pulse 1s infinite;
        }
        
        .pnl-positive { color: #10b981; }
        .pnl-negative { color: #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 Polymarket 聪明钱动向</h1>
            <div class="subtitle">实时追踪 Top 聪明钱交易者的最新动态</div>
        </div>
        
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="totalTraders">-</div>
                <div class="stat-label">监控地址数</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalTrades">-</div>
                <div class="stat-label">48小时交易数</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="avgWinRate">-</div>
                <div class="stat-label">平均胜率</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalVolume">-</div>
                <div class="stat-label">48小时总量</div>
            </div>
        </div>
        
        <div class="traders-grid" id="tradersGrid">
            <div class="trader-card">
                <div class="loading">加载中...</div>
            </div>
        </div>
        
        <div class="last-update">
            最后更新: <span id="lastUpdate">-</span>
        </div>
    </div>
    
    <script>
        async function fetchDashboard() {
            try {
                // Try local API first (for local dev), fallback to static JSON
                let data;
                try {
                    const localRes = await fetch(`${window.location.origin}/api/traders`);
                    if (localRes.ok) {
                        data = await localRes.json();
                    } else {
                        throw new Error('no local api');
                    }
                } catch(e) {
                    // Fallback to static JSON (for GitHub Pages)
                    const res = await fetch('./dashboard-data.json?t=' + Date.now());
                    if (!res.ok) throw new Error('No data');
                    data = await res.json();
                }
                updateDashboard(data);
            } catch (error) {
                console.error('Failed to fetch dashboard:', error);
                document.getElementById('tradersGrid').innerHTML = 
                    '<div class="error">暂无数据，请稍后刷新</div>';
            }
        }
        
        function updateDashboard(data) {
            // Update stats
            document.getElementById('totalTraders').textContent = data.traders.length;
            
            const totalTrades = data.traders.reduce((sum, t) => sum + (t.stats48h?.totalTrades || 0), 0);
            document.getElementById('totalTrades').textContent = totalTrades;
            
            const totalVolume = data.traders.reduce((sum, t) => sum + (t.stats48h?.volume || 0), 0);
            document.getElementById('totalVolume').textContent = '$' + formatNumber(totalVolume);
            
            const avgWinRate = data.traders.length > 0 
                ? data.traders.reduce((sum, t) => sum + (t.stats48h?.winRate || 0), 0) / data.traders.length
                : 0;
            document.getElementById('avgWinRate').textContent = (avgWinRate * 100).toFixed(1) + '%';
            
            // Update traders grid
            const grid = document.getElementById('tradersGrid');
            grid.innerHTML = '';
            
            // Sort by win rate descending
            const sorted = [...data.traders].sort((a, b) => (b.stats48h?.winRate || 0) - (a.stats48h?.winRate || 0));
            
            for (const trader of sorted) {
                const card = createTraderCard(trader);
                grid.appendChild(card);
            }
            
            // Update last update time
            const updateTime = new Date(data.lastUpdate).toLocaleString('zh-CN');
            document.getElementById('lastUpdate').textContent = updateTime;
        }
        
        function createTraderCard(trader) {
            const card = document.createElement('div');
            card.className = 'trader-card';
            
            const winRate = trader.stats48h?.winRate || 0;
            const winRateClass = winRate >= 0.6 ? 'high' : winRate >= 0.4 ? 'medium' : 'low';
            const wins = trader.stats48h?.wins || 0;
            const losses = trader.stats48h?.losses || 0;
            const totalTrades = trader.stats48h?.totalTrades || 0;
            const volume = trader.stats48h?.volume || 0;
            const pnl = trader.stats48h?.pnl || 0;
            const pnlClass = pnl >= 0 ? 'pnl-positive' : 'pnl-negative';
            const pnlSign = pnl >= 0 ? '+' : '';
            
            const shortAddr = trader.address.slice(0, 6) + '...' + trader.address.slice(-4);
            
            card.innerHTML = `
                <div class="trader-header">
                    <div>
                        <div class="trader-name">${trader.label}</div>
                        <div class="trader-address">${shortAddr}</div>
                    </div>
                    <div class="win-rate ${winRateClass}">
                        <div class="win-rate-value">${(winRate * 100).toFixed(0)}%</div>
                        <div class="win-rate-label">48h胜率</div>
                    </div>
                </div>
                <div class="trader-stats">
                    <div class="trader-stat">
                        <div class="trader-stat-value">${wins}/${wins + losses}</div>
                        <div class="trader-stat-label">胜/总</div>
                    </div>
                    <div class="trader-stat">
                        <div class="trader-stat-value">${totalTrades}</div>
                        <div class="trader-stat-label">交易数</div>
                    </div>
                    <div class="trader-stat">
                        <div class="trader-stat-value">$${formatNumber(volume)}</div>
                        <div class="trader-stat-label">成交量</div>
                    </div>
                    <div class="trader-stat">
                        <div class="trader-stat-value ${pnlClass}">${pnlSign}$${formatNumber(Math.abs(pnl))}</div>
                        <div class="trader-stat-label">48h PnL</div>
                    </div>
                </div>
                <div class="trades-list">
                    ${trader.recentTrades.length === 0 ? '<div class="no-trades">暂无交易</div>' : ''}
                    ${trader.recentTrades.slice(0, 10).map(trade => {
                        const marketUrl = trade.event_slug 
                            ? `https://polymarket.com/event/${trade.event_slug}`
                            : trade.slug 
                                ? `https://polymarket.com/event/${trade.slug}`
                                : '#';
                        return `
                        <a href="${marketUrl}" target="_blank" rel="noopener" class="trade-item ${trade.side.toLowerCase()}" style="text-decoration:none;color:inherit;">
                            <div class="trade-info">
                                <div class="trade-title">${trade.title}</div>
                                <div class="trade-meta">${trade.outcome} @ ${(trade.price * 100).toFixed(1)}¢</div>
                            </div>
                            <div>
                                <div class="trade-side ${trade.side.toLowerCase()}">
                                    ${trade.side === 'BUY' ? '📈' : '📉'} ${trade.side}
                                </div>
                                <div class="trade-amount">$${formatNumber(trade.value)}</div>
                                <div class="trade-time">${formatTime(trade.timestamp)}</div>
                            </div>
                        </a>
                    `).join('')}
                </div>
            `;
            
            return card;
        }
        
        function formatNumber(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(2) + 'M';
            } else if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num.toFixed(0);
        }
        
        function formatTime(timestamp) {
            const date = new Date(timestamp * 1000);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            
            if (diffMins < 1) return '刚刚';
            if (diffMins < 60) return diffMins + '分钟前';
            if (diffHours < 24) return diffHours + '小时前';
            return date.toLocaleDateString('zh-CN');
        }
        
        // Initial fetch
        fetchDashboard();
        
        // Refresh every 60 seconds
        setInterval(fetchDashboard, 60000);
    </script>
</body>
</html>
